# Run the whole Customers & Orders (choreography saga) application locally.
#
#   docker compose up -d --build        # build jars inside Docker + start everything
#   tail -f logs/saga.log               # watch the saga timeline
#   ./docker-local/saga-demo.sh         # run the 4 saga scenarios against the API Gateway
#   docker compose down -v              # stop and delete all data
#
# See docker-local/README.md for details.

name: saga-choreography

x-app-service: &app-service
  restart: on-failure
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # log files on the host stay owned by you
  volumes:
    - ./docker-local/logback.xml:/config/logback.xml:ro
    - ./logs:/logs

x-app-env: &app-env
  LOGGING_CONFIG: /config/logback.xml
  LOG_DIR: /logs
  JAVA_OPTS: -Xmx384m
  EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  MANAGEMENT_TRACING_EXPORT_ENABLED: "false"

x-db-env: &db-env
  MYSQL_DATABASE: eventuate
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_USER: mysqluser
  MYSQL_PASSWORD: mysqlpw

services:

  # ---------------------------------------------------------------- infrastructure

  kafka:
    image: apache/kafka-native:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 3s
      retries: 30

  # Database per service: each service has its own MySQL with its own MESSAGE (outbox) table
  order-db:
    image: eventuateio/eventuate-vanilla-mysql8:0.22.0.RELEASE
    environment: *db-env
    ports:
      - "3307:3306"

  customer-db:
    image: eventuateio/eventuate-vanilla-mysql8:0.22.0.RELEASE
    environment: *db-env
    ports:
      - "3308:3306"

  mongodb:
    image: mongo:8.0.4
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 30

  # Change Data Capture: tails the MySQL binlog of BOTH databases and publishes MESSAGE rows to Kafka
  cdc-service:
    image: eventuateio/eventuate-cdc-service:0.20.0.RELEASE
    ports:
      - "8099:8080"
    depends_on:
      kafka:
        condition: service_healthy
      order-service:          # Flyway in each service creates the MESSAGE / cdc_monitoring tables
        condition: service_healthy
      customer-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: KafkaLeadership
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EVENTUATE_CDC_READER_READER1_TYPE: mysql-binlog
      EVENTUATE_CDC_READER_READER1_DATASOURCEURL: jdbc:mysql://order-db:3306/eventuate
      EVENTUATE_CDC_READER_READER1_DATASOURCEUSERNAME: root
      EVENTUATE_CDC_READER_READER1_DATASOURCEPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER1_DATASOURCEDRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_CDC_READER_READER1_CDCDBUSERNAME: root
      EVENTUATE_CDC_READER_READER1_CDCDBPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER1_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/order-db
      EVENTUATE_CDC_READER_READER1_OUTBOXID: 1
      EVENTUATE_CDC_READER_READER1_MONITORINGSCHEMA: eventuate
      EVENTUATE_CDC_READER_READER1_OFFSETSTORAGETOPICNAME: db.history.common
      EVENTUATE_CDC_READER_READER1_READOLDDEBEZIUMDBOFFSETSTORAGETOPIC: "false"
      EVENTUATE_CDC_READER_READER1_MYSQLBINLOGCLIENTUNIQUEID: 1
      EVENTUATE_CDC_READER_READER1_OFFSETSTOREKEY: order-db
      EVENTUATE_CDC_PIPELINE_PIPELINE1_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE1_READER: reader1
      EVENTUATE_CDC_PIPELINE_PIPELINE1_EVENTUATEDATABASESCHEMA: eventuate

      EVENTUATE_CDC_READER_READER2_TYPE: mysql-binlog
      EVENTUATE_CDC_READER_READER2_DATASOURCEURL: jdbc:mysql://customer-db:3306/eventuate
      EVENTUATE_CDC_READER_READER2_DATASOURCEUSERNAME: root
      EVENTUATE_CDC_READER_READER2_DATASOURCEPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER2_DATASOURCEDRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_CDC_READER_READER2_CDCDBUSERNAME: root
      EVENTUATE_CDC_READER_READER2_CDCDBPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER2_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/customer-db
      EVENTUATE_CDC_READER_READER2_OUTBOXID: 2
      EVENTUATE_CDC_READER_READER2_MONITORINGSCHEMA: eventuate
      EVENTUATE_CDC_READER_READER2_OFFSETSTORAGETOPICNAME: db.history.common
      EVENTUATE_CDC_READER_READER2_READOLDDEBEZIUMDBOFFSETSTORAGETOPIC: "false"
      EVENTUATE_CDC_READER_READER2_MYSQLBINLOGCLIENTUNIQUEID: 2
      EVENTUATE_CDC_READER_READER2_OFFSETSTOREKEY: customer-db
      EVENTUATE_CDC_PIPELINE_PIPELINE2_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE2_READER: reader2
      EVENTUATE_CDC_PIPELINE_PIPELINE2_EVENTUATEDATABASESCHEMA: eventuate

  # ---------------------------------------------------------------- application services

  order-service:
    <<: *app-service
    build: { context: ., dockerfile: docker-local/Dockerfile, target: order-service }
    image: saga-demo/order-service
    ports:
      - "8081:8080"
    depends_on:
      kafka: { condition: service_healthy }
      order-db: { condition: service_healthy }
    environment:
      <<: *app-env
      SERVICE_NAME: order-service
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/eventuate
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_DATABASE_SCHEMA: eventuate

  customer-service:
    <<: *app-service
    build: { context: ., dockerfile: docker-local/Dockerfile, target: customer-service }
    image: saga-demo/customer-service
    ports:
      - "8082:8080"
    depends_on:
      kafka: { condition: service_healthy }
      customer-db: { condition: service_healthy }
    environment:
      <<: *app-env
      SERVICE_NAME: customer-service
      SPRING_DATASOURCE_URL: jdbc:mysql://customer-db:3306/eventuate
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_DATABASE_SCHEMA: eventuate

  order-history-service:
    <<: *app-service
    build: { context: ., dockerfile: docker-local/Dockerfile, target: order-history-service }
    image: saga-demo/order-history-service
    ports:
      - "8083:8080"
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    environment:
      <<: *app-env
      SERVICE_NAME: order-history-service
      SPRING_MONGODB_URI: mongodb://mongodb/customers_and_orders

  api-gateway:
    <<: *app-service
    build: { context: ., dockerfile: docker-local/Dockerfile, target: api-gateway-service }
    image: saga-demo/api-gateway-service
    ports:
      - "8080:8080"
    depends_on:
      order-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      order-history-service: { condition: service_healthy }
    environment:
      <<: *app-env
      SERVICE_NAME: api-gateway
      CUSTOMER_DESTINATIONS_CUSTOMERSERVICEURL: http://customer-service:8080
      ORDER_DESTINATIONS_ORDERSERVICEURL: http://order-service:8080
      ORDERHISTORY_DESTINATIONS_ORDERHISTORYSERVICEURL: http://order-history-service:8080
      APIGATEWAY_TIMEOUT_MILLIS: 5000
